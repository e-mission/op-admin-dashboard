# docker-compose.tests.yml
services:
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVER_IMAGE_TAG: ${SERVER_IMAGE_TAG}
    image: e-mission/opdash:0.0.1
  dashboard-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
      additional_contexts:
        dashboard-base: service:dashboard
    image: e-mission/opdash-tests:0.0.1
    environment:
      DASH_DEBUG_MODE: "True"
      PYTHONPATH: /usr/src/app
      DB_HOST: db
      CONFIGS_URL: "https://raw.githubusercontent.com/e-mission/op-deployment-configs/main/configs/"
      STUDY_CONFIG: "stage-program"
    depends_on:
      - db
    volumes:
      - ./pages:/usr/src/app/pages
      - ./utils:/usr/src/app/utils
      - ./tests:/usr/src/app/tests
  db:
    image: mongo:8.0.4
